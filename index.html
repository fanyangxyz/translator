<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Translation Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>AI Translation Evaluator</h1>
            <p>Enter your translation and get AI-powered quality evaluation</p>
        </header>

        <div id="translation-container">
            <div class="language-selectors">
                <div class="lang-select">
                    <label for="source-lang">From:</label>
                    <select id="source-lang">
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="zh">Chinese</option>
                        <option value="ar">Arabic</option>
                        <option value="hi">Hindi</option>
                    </select>
                </div>

                <button id="swap-languages">⇄</button>

                <div class="lang-select">
                    <label for="target-lang">To:</label>
                    <select id="target-lang">
                        <option value="zh" selected>Chinese</option>
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="ar">Arabic</option>
                        <option value="hi">Hindi</option>
                    </select>
                </div>
            </div>

            <div class="text-areas">
                <div class="input-section">
                    <label for="source-text">Original Text:</label>
                    <textarea id="source-text" placeholder="Enter the original text..."></textarea>
                    <div class="text-info">
                        <span id="source-char-count">0 characters</span>
                        <div class="text-controls">
                            <button id="load-example">Load Example</button>
                            <button id="clear-source">Clear</button>
                        </div>
                    </div>
                </div>

                <div class="output-section">
                    <label for="translated-text">Your Translation:</label>
                    <textarea id="translated-text" placeholder="Enter your translation here..."></textarea>
                    <div class="text-info">
                        <span id="translation-char-count">0 characters</span>
                        <button id="clear-translation">Clear</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="settings-container">
            <div class="settings-section">
                <h3>Settings</h3>
                <div class="api-key-section">
                    <label for="api-key">Claude API Key:</label>
                    <div class="api-key-input-group">
                        <input type="password" id="api-key" placeholder="Enter your Claude API key">
                        <button id="toggle-api-key" type="button">👁️</button>
                    </div>
                    <small class="api-key-help">Get your API key from <a href="https://console.anthropic.com/" target="_blank">Anthropic Console</a></small>
                </div>

            </div>
        </div>

        <div class="translation-controls">
            <button id="evaluate-btn">Evaluate Translation</button>
            <div id="loading" class="hidden">Evaluating...</div>
        </div>

        <div id="evaluation-section" class="hidden">
            <h3>AI Quality Evaluation</h3>
            <div id="evaluation-content">
                <div class="score-display">
                    <span class="score-label">Translation Quality Score:</span>
                    <span id="quality-score">-</span>
                </div>
                <div class="evaluation-details">
                    <h4>Evaluation Breakdown:</h4>
                    <div id="evaluation-metrics"></div>
                </div>
                <div class="evaluation-feedback">
                    <h4>AI Feedback:</h4>
                    <p id="ai-feedback"></p>

                    <div class="conversation-section">
                        <h5>Discuss with AI:</h5>
                        <div id="conversation-history" class="conversation-history"></div>
                        <div class="conversation-input">
                            <textarea id="conversation-message" placeholder="Ask questions about your translation evaluation..." rows="2"></textarea>
                            <button id="send-message">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
